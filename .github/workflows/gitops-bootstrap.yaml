name: GitOps Bootstrap

# Applies the app-of-apps root Application once ArgoCD is up on a fresh
# cluster. After this runs once, ArgoCD syncs everything in kubernetes/apps/
# itself - this workflow is only needed again after a full destroy/recreate.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  apply-root-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::447924746567:role/github-action
          aws-region: eu-west-2

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name eks-cluster --region eu-west-2

      - name: Apply root Application
        run: kubectl apply -f kubernetes/apps/root.yaml
