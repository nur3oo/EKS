apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # Helm chart from the community repo and the values from my git repo.
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
    
      # Checks latest: helm repo update helm search repo prometheus-community/kube-prometheus-stack
      targetRevision: "72.3.0"
      helm:
        releaseName: monitoring
        valueFiles:
          
          - $values/kubernetes/monitoring/values/base.yaml

    - repoURL: https://github.com/nur3oo/EKS.git
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true      # remove resources deleted from git
      selfHeal: true   # revert manual cluster changes
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # required for kube-prometheus-stack CRDs
