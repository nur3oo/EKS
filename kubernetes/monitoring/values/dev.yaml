# Dev environment overrides
# Goal: low cost, fast startup. No HA, no persistent storage.

prometheus:
  prometheusSpec:
    retention: 7d
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi
    # No PVC — data lost on pod restart (acceptable in dev)
    storageSpec: {}

alertmanager:
  alertmanagerSpec:
    replicas: 1
    # No PVC in dev
    storage: {}

grafana:
  replicas: 1
  persistence:
    enabled: false
  grafana.ini:
    server:
      root_url: "http://grafana.dev.example.com"  # TODO: replace with your dev URL
